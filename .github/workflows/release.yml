name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and resolve registry name
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Tag must match pyproject.toml project version")
          image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"image={image}", file=output)
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the validated image with build provenance and SBOM
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.image }}:${{ github.ref_name }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Publish immutable release metadata and local usage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPIRITOPS_IMAGE: ${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          image = os.environ["SPIRITOPS_IMAGE"]
          Path("release.json").write_text(json.dumps({
              "tag": os.environ["RELEASE_TAG"], "revision": os.environ["GITHUB_SHA"],
              "image": image, "platform": "linux/amd64",
              "uv_lock_sha256": hashlib.sha256(Path("uv.lock").read_bytes()).hexdigest(),
              "validation": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
          }, indent=2) + "\n")
          Path("release-notes.md").write_text(
              "From a checkout of this tag on Linux/amd64 (including Docker Desktop with WSL2), run\n\n"
              f"```sh\nexport SPIRITOPS_IMAGE={image}\ndocker pull \"$SPIRITOPS_IMAGE\"\n"
              "docker compose up --no-build --wait --wait-timeout 1800 -d\n```\n\n"
              "The image includes a BuildKit SBOM attestation. Model promotion runs locally through the model release gates.\n"
          )
          PY
          gh release create "$RELEASE_TAG" release.json --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
